      <rect x="332" y="285" width="165" height="184" rx="17" fill="#98ffba" fill-opacity=".07" stroke="#9fffc0" stroke-opacity=".2"/><path d="M356 433L379 331 403 414 429 320 451 403 473 349" fill="none" stroke="url(#lime)" stroke-width="4"/>
