      <path d="M92 153L187 105 246 175 166 230 92 153Z"/><path d="M92 274L166 230 246 306 166 380 92 342Z"/><path d="M92 451L166 380 246 465 187 530Z"/>
      <path d="M92 153V274M92 342V451M187 105L166 230M246 175V306M246 306V465M166 380L187 530"/>
    </g>
    <g fill="#9ba7ff" filter="url(#glow)"><circle cx="92" cy="153" r="6" class="pulse"/><circle cx="187" cy="105" r="5" class="pulse d1"/><circle cx="246" cy="175" r="6" class="pulse d2"/><circle cx="166" cy="230" r="5" class="pulse d3"/><circle cx="92" cy="274" r="6" class="pulse d1"/><circle cx="246" cy="306" r="6" class="pulse"/><circle cx="92" cy="342" r="5" class="pulse d2"/><circle cx="166" cy="380" r="6" class="pulse d3"/><circle cx="92" cy="451" r="6" class="pulse"/><circle cx="246" cy="465" r="6" class="pulse d1"/><circle cx="187" cy="530" r="5" class="pulse d2"/></g>
    <g fill="none" stroke-linecap="round"><path d="M250 306H1060" stroke="#8492ff" stroke-opacity=".28" stroke-width="2"/><path d="M250 306H1060" stroke="url(#violet)" stroke-width="4" class="trace"/><path d="M250 465C307 465 293 566 360 566H965C1030 566 1015 392 1080 392" stroke="#9bffa9" stroke-opacity=".24" stroke-width="2"/><path d="M250 465C307 465 293 566 360 566H965C1030 566 1015 392 1080 392" stroke="url(#lime)" stroke-width="3" class="trace fast"/></g>
    <g>
