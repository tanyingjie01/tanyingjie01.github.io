<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Transformer circuit</title>
  <desc id="desc">Signals move from input tokens through attention and feed-forward modules toward an output state.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111528"/><stop offset=".56" stop-color="#090c15"/><stop offset="1" stop-color="#151126"/></linearGradient>
    <linearGradient id="violet" x2="1"><stop stop-color="#91a0ff"/><stop offset="1" stop-color="#7455ff"/></linearGradient>
    <linearGradient id="lime" x2="1"><stop stop-color="#d8ff83"/><stop offset="1" stop-color="#75e6b2"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#705cff" stop-opacity=".28"/><stop offset="1" stop-color="#705cff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b8c0ff" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="678" rx="34"/></clipPath>
  </defs>
  <style>
    .trace{stroke-dasharray:12 14;animation:trace 7s linear infinite}.fast{animation-duration:4.8s}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}.d1{animation-delay:-.7s}.d2{animation-delay:-1.4s}.d3{animation-delay:-2.1s}.scan{animation:scan 5s ease-in-out infinite}.matrix{animation:matrix 3.6s ease-in-out infinite}.matrix.d2{animation-delay:-1.8s}
    @keyframes trace{to{stroke-dashoffset:-260}}@keyframes pulse{50%{transform:scale(1.45);opacity:1}0%,100%{transform:scale(.8);opacity:.48}}@keyframes scan{0%,100%{transform:translateY(0);opacity:.08}50%{transform:translateY(250px);opacity:.38}}@keyframes matrix{0%,100%{opacity:.24}50%{opacity:.86}}
    @media(prefers-reduced-motion:reduce){.trace,.pulse,.scan,.matrix{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="680" rx="34" fill="url(#bg)"/><rect width="1200" height="680" fill="url(#grid)"/><circle cx="680" cy="270" r="390" fill="url(#halo)"/>
    <path d="M0 566C208 465 339 637 563 535S931 432 1200 520" fill="none" stroke="#7c68ff" stroke-opacity=".055" stroke-width="90"/>
