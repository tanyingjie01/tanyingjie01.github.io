      <rect x="575" y="112" width="165" height="21" rx="10" fill="url(#violet)" opacity=".28" class="scan"/>
    </g>
    <g>
      <rect x="798" y="105" width="205" height="395" rx="24" fill="#f2f3ff" fill-opacity=".045" stroke="#aab3ff" stroke-opacity=".25"/>
      <rect x="818" y="132" width="165" height="132" rx="17" fill="#7b86ff" fill-opacity=".1" stroke="#9aa5ff" stroke-opacity=".25"/>
      <path d="M840 226C870 174 898 233 927 165S965 216 974 151" fill="none" stroke="url(#violet)" stroke-width="4" class="trace fast"/>
      <rect x="818" y="285" width="165" height="184" rx="17" fill="#98ffba" fill-opacity=".07" stroke="#9fffc0" stroke-opacity=".2"/><g fill="#9fffc0"><circle cx="850" cy="326" r="5" class="pulse"/><circle cx="900" cy="378" r="7" class="pulse d1"/><circle cx="954" cy="337" r="4" class="pulse d2"/><circle cx="854" cy="430" r="4" class="pulse d3"/><circle cx="954" cy="423" r="6" class="pulse"/></g><path d="M850 326L900 378 954 337M900 378L854 430M900 378L954 423" fill="none" stroke="#9fffc0" stroke-opacity=".45"/>
    </g>
    <g><circle cx="1090" cy="306" r="55" fill="#0c101c" stroke="#91a0ff" stroke-opacity=".5" stroke-width="2"/><circle cx="1090" cy="306" r="29" fill="url(#violet)" filter="url(#glow)" class="pulse d1"/><path d="M1090 230V195M1090 417V382M1014 306H980M1200 306H1166" stroke="#9ca7ff" stroke-opacity=".4"/></g>
    <g fill="#dbe0ff" opacity=".45"><circle cx="47" cy="73" r="2"/><circle cx="289" cy="49" r="2"/><circle cx="540" cy="52" r="2"/><circle cx="780" cy="52" r="2"/><circle cx="1139" cy="77" r="2"/><circle cx="1080" cy="601" r="2"/><circle cx="706" cy="622" r="2"/><circle cx="345" cy="615" r="2"/></g>
