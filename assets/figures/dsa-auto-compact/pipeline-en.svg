<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img">
<title>One long-prefix prefill, followed by staged memory selection</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9397a8"/></marker></defs>
<rect width="1000" height="330" rx="12" fill="#fcfcfb"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#191a20">
<text x="30" y="38" font-size="22" font-weight="600">One long-prefix prefill, followed by staged memory selection</text>
<rect x="30" y="66" width="290" height="134" rx="9" fill="white" stroke="#dcdcd5"/>
<text x="47" y="98" fill="#5363ee" font-size="18" font-weight="600">01  Generic reference</text>
<text x="47" y="133" font-size="16">Score the full cache</text>
<text x="47" y="162" font-size="16">Freeze per-layer S and s</text>
<path d="M325 132H350" fill="none" stroke="#9397a8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="66" width="290" height="134" rx="9" fill="white" stroke="#dcdcd5"/>
<text x="372" y="98" fill="#5363ee" font-size="18" font-weight="600">02  Restricted query probe</text>
<text x="372" y="133" font-size="16">The query reads only S</text>
<text x="372" y="162" font-size="16">Select 24 windows of 128 tokens</text>
<path d="M650 132H675" fill="none" stroke="#9397a8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="66" width="290" height="134" rx="9" fill="white" stroke="#dcdcd5"/>
<text x="697" y="98" fill="#5363ee" font-size="18" font-weight="600">03  Final physical rewrite</text>
<text x="697" y="133" font-size="16">Restore missing rows from full cache</text>
<text x="697" y="162" font-size="16">Preserve S to form S ∪ R</text>
<text x="500" y="242" text-anchor="middle" font-size="17" fill="#70737d">Keep the full cache until the final copy; rewind temporary reference and probe states.</text>
<text x="500" y="289" text-anchor="middle" font-size="19" fill="#2f9d78" font-weight="600">Replay the short query on final memory, then continue decoding</text>
</g></svg>
