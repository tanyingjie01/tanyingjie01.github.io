<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Tan two-dimensional solar system</title>
  <desc id="desc">Colorful illustrated planets orbit the dark Tan center on concentric paths in the site's blue, lime, and coral palette.</desc>
  <defs>
    <linearGradient id="panel" x1=".08" y1=".04" x2=".92" y2=".96">
      <stop stop-color="#f1f2ff"/>
      <stop offset=".55" stop-color="#f8f8f3"/>
      <stop offset="1" stop-color="#eef0fa"/>
    </linearGradient>
    <linearGradient id="tan-core" x1=".22" y1=".12" x2=".78" y2=".9">
      <stop stop-color="#30323b"/>
      <stop offset=".5" stop-color="#191a20"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="violet-planet" x1=".12" y1=".1" x2=".9" y2=".92">
      <stop stop-color="#8994ff"/>
      <stop offset="1" stop-color="#5363ee"/>
    </linearGradient>
    <linearGradient id="cyan-planet" x1=".08" y1=".12" x2=".92" y2=".88">
      <stop stop-color="#8ae6e5"/>
      <stop offset="1" stop-color="#43b9c0"/>
    </linearGradient>
    <linearGradient id="lime-planet" x1=".1" y1=".08" x2=".88" y2=".9">
      <stop stop-color="#e4ff9d"/>
      <stop offset="1" stop-color="#a8e94a"/>
    </linearGradient>
    <linearGradient id="coral-planet" x1=".08" y1=".08" x2=".9" y2=".92">
      <stop stop-color="#f29a7d"/>
      <stop offset="1" stop-color="#d86f4d"/>
    </linearGradient>
    <pattern id="micro-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5363ee" opacity=".055"/>
    </pattern>
    <filter id="soft-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#30365f" flood-opacity=".16"/>
    </filter>
    <filter id="core-shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#323968" flood-opacity=".24"/>
    </filter>
    <filter id="neon-glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="798" height="798" rx="58"/></clipPath>
    <clipPath id="planet-stripes"><circle r="34"/></clipPath>
    <clipPath id="planet-waves"><circle r="29"/></clipPath>
  </defs>
  <style>
    .orbit{fill:none;stroke:#7c84b8;stroke-opacity:.34;stroke-width:1.5}.orbit-accent{fill:none;stroke:#5363ee;stroke-opacity:.24;stroke-width:2;stroke-linecap:round;stroke-dasharray:4 25;animation:dash 13s linear infinite}.orbiter{animation:orbit-around var(--speed) linear infinite}.o1{--speed:6s;--r:112px;--a:103.48px;--b:42.86px;--d:79.2px;animation-delay:-4.5s}.o2{--speed:9s;--r:158px;--a:145.98px;--b:60.47px;--d:111.72px}.o3{--speed:12.5s;--r:204px;--a:188.47px;--b:78.07px;--d:144.25px;animation-delay:-9.375s}.o4{--speed:16s;--r:250px;--a:230.97px;--b:95.67px;--d:176.78px;animation-delay:-8s}.o5{--speed:20s;--r:296px;--a:273.47px;--b:113.28px;--d:209.3px;animation-delay:-15s}.o6{--speed:25s;--r:342px;--a:315.97px;--b:130.88px;--d:241.83px}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}.star{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}.d1{animation-delay:-.8s}.d2{animation-delay:-1.6s}.d3{animation-delay:-2.4s}.core-ring>circle:first-child{animation:core-dash 11s linear infinite}.core-ring.reverse>circle:first-child{animation-direction:reverse;animation-duration:16s}.core-scanner{animation:core-scan 3.6s linear infinite}.data-particle{transform-box:fill-box;transform-origin:center;animation:orbit-around var(--particle-speed) linear infinite,particle-pop 2.4s ease-in-out infinite}.particle-fast{--particle-speed:5.2s;--r:114px;--a:105.33px;--b:43.63px;--d:80.61px}.particle-slow{--particle-speed:8.5s;--r:122px;--a:112.72px;--b:46.69px;--d:86.27px}.particle-fast.p2{animation-delay:-1.3s,-.5s}.particle-fast.p3{animation-delay:-2.6s,-1.1s}.particle-fast.p4{animation-delay:-3.9s,-1.8s}.particle-slow.p2{animation-delay:-2.125s,-.5s}.particle-slow.p3{animation-delay:-4.25s,-1.1s}.particle-slow.p4{animation-delay:-6.375s,-1.8s}
    .o1{transform:translate(400px,288px)}.o2{transform:translate(558px,400px)}.o3{transform:translate(400px,196px)}.o4{transform:translate(150px,400px)}.o5{transform:translate(400px,104px)}.o6{transform:translate(742px,400px)}.particle-fast.p1{transform:translate(514px,400px)}.particle-fast.p2{transform:translate(400px,514px)}.particle-fast.p3{transform:translate(286px,400px)}.particle-fast.p4{transform:translate(400px,286px)}.particle-slow.p1{transform:translate(522px,400px)}.particle-slow.p2{transform:translate(400px,522px)}.particle-slow.p3{transform:translate(278px,400px)}.particle-slow.p4{transform:translate(400px,278px)}
    @keyframes orbit-around{0%,100%{transform:translate(calc(400px + var(--r)),400px)}6.25%{transform:translate(calc(400px + var(--a)),calc(400px + var(--b)))}12.5%{transform:translate(calc(400px + var(--d)),calc(400px + var(--d)))}18.75%{transform:translate(calc(400px + var(--b)),calc(400px + var(--a)))}25%{transform:translate(400px,calc(400px + var(--r)))}31.25%{transform:translate(calc(400px - var(--b)),calc(400px + var(--a)))}37.5%{transform:translate(calc(400px - var(--d)),calc(400px + var(--d)))}43.75%{transform:translate(calc(400px - var(--a)),calc(400px + var(--b)))}50%{transform:translate(calc(400px - var(--r)),400px)}56.25%{transform:translate(calc(400px - var(--a)),calc(400px - var(--b)))}62.5%{transform:translate(calc(400px - var(--d)),calc(400px - var(--d)))}68.75%{transform:translate(calc(400px - var(--b)),calc(400px - var(--a)))}75%{transform:translate(400px,calc(400px - var(--r)))}81.25%{transform:translate(calc(400px + var(--b)),calc(400px - var(--a)))}87.5%{transform:translate(calc(400px + var(--d)),calc(400px - var(--d)))}93.75%{transform:translate(calc(400px + var(--a)),calc(400px - var(--b)))}}@keyframes dash{to{stroke-dashoffset:-232}}@keyframes core-dash{to{stroke-dashoffset:-260}}@keyframes core-scan{to{stroke-dashoffset:-547}}@keyframes pulse{0%,100%{opacity:.025}50%{opacity:.075}}@keyframes twinkle{0%,100%{opacity:.26;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}@keyframes particle-pop{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.orbit-accent,.orbiter,.pulse,.star,.core-ring>circle:first-child,.core-scanner,.data-particle{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="800" height="800" rx="58" fill="url(#panel)"/>
    <rect width="800" height="800" fill="url(#micro-grid)"/>
    <circle cx="400" cy="400" r="354" fill="#5363ee" opacity=".025"/>

    <g>
      <circle class="orbit" cx="400" cy="400" r="112"/>
      <circle class="orbit" cx="400" cy="400" r="158"/>
      <circle class="orbit" cx="400" cy="400" r="204"/>
      <circle class="orbit" cx="400" cy="400" r="250"/>
      <circle class="orbit" cx="400" cy="400" r="296"/>
      <circle class="orbit" cx="400" cy="400" r="342"/>
      <circle class="orbit-accent" cx="400" cy="400" r="181"/>
      <circle class="orbit-accent" cx="400" cy="400" r="319" style="animation-direction:reverse;animation-duration:18s"/>
    </g>

    <g fill="#5363ee">
      <g class="star"><path d="M91 148h14M98 141v14" stroke="#5363ee" stroke-width="2"/><circle cx="98" cy="148" r="2"/></g>
      <g class="star d1"><path d="M689 126h18M698 117v18" stroke="#5363ee" stroke-width="2"/><circle cx="698" cy="126" r="2"/></g>
      <g class="star d2"><path d="M721 601h14M728 594v14" stroke="#5363ee" stroke-width="2"/><circle cx="728" cy="601" r="2"/></g>
      <g class="star d3"><path d="M122 661h18M131 652v18" stroke="#5363ee" stroke-width="2"/><circle cx="131" cy="661" r="2"/></g>
      <circle cx="174" cy="93" r="3" class="star d2"/><circle cx="633" cy="77" r="2.5" class="star d3"/><circle cx="753" cy="328" r="3" class="star d1"/><circle cx="69" cy="418" r="2.5" class="star"/><circle cx="234" cy="735" r="2.5" class="star d1"/><circle cx="575" cy="724" r="3" class="star d3"/>
    </g>
    <g fill="#c8ff5a"><circle cx="91" cy="285" r="3" class="star d1"/><circle cx="701" cy="229" r="3.5" class="star d2"/><circle cx="676" cy="683" r="2.5" class="star"/><circle cx="289" cy="77" r="2.5" class="star d3"/></g>
    <g fill="#d86f4d"><circle cx="154" cy="566" r="2.5" class="star d3"/><circle cx="736" cy="484" r="2.5" class="star d1"/></g>

    <g class="orbiter o6" filter="url(#soft-shadow)">
      <ellipse rx="46" ry="13" fill="#fdfdf9" stroke="#5363ee" stroke-width="5" transform="rotate(-13)"/>
      <circle r="31" fill="url(#violet-planet)"/>
      <path d="M-28-5C-8 2 11 3 29-4M-25 11C-7 17 10 17 24 11" fill="none" stroke="#aeb6ff" stroke-width="6" opacity=".72" clip-path="url(#planet-waves)"/>
      <ellipse rx="46" ry="13" fill="none" stroke="#fdfdf9" stroke-width="5" transform="rotate(-13)"/>
    </g>

    <g class="orbiter o5" filter="url(#soft-shadow)">
      <circle r="34" fill="url(#lime-planet)"/>
      <g clip-path="url(#planet-stripes)" fill="none" stroke="#5363ee" stroke-width="8" opacity=".46">
        <path d="M-40-19C-17-9 15-9 41-21"/><path d="M-43 0C-14 10 14 8 43-3"/><path d="M-39 19C-12 27 15 24 39 13"/>
      </g>
      <circle r="34" fill="none" stroke="#93cf36" stroke-width="2"/>
    </g>

    <g class="orbiter o4" filter="url(#soft-shadow)">
      <circle r="27" fill="url(#cyan-planet)"/>
      <path d="M-21-13C-8-18-1-7 8-10S18-13 23-5C16 1 5 2 2 11S-13 21-21 12C-13 5-17-1-21-13Z" fill="#5363ee" opacity=".42"/>
      <circle cx="14" cy="-13" r="6" fill="#c8ff5a" opacity=".78"/>
    </g>

    <g class="orbiter o3" filter="url(#soft-shadow)">
      <circle r="24" fill="url(#coral-planet)"/>
      <circle cx="-8" cy="-5" r="5" fill="#b84d33" opacity=".58"/><circle cx="9" cy="7" r="7" fill="#f4b19c" opacity=".48"/><circle cx="12" cy="-12" r="3.5" fill="#a9432c" opacity=".5"/>
    </g>

    <g class="orbiter o2" filter="url(#soft-shadow)">
      <ellipse rx="31" ry="9" fill="none" stroke="#191a20" stroke-width="4" transform="rotate(-16)" opacity=".72"/>
      <circle r="20" fill="url(#lime-planet)"/>
      <path d="M-17 2C-5 7 7 7 17 1" fill="none" stroke="#5363ee" stroke-width="4" opacity=".5"/>
      <circle cx="29" cy="0" r="4.5" fill="#d86f4d"/>
    </g>

    <g class="orbiter o1" filter="url(#soft-shadow)">
      <circle r="13" fill="url(#violet-planet)"/>
      <circle cx="-4" cy="-4" r="3" fill="#dfe2ff" opacity=".72"/>
    </g>

    <g class="core-ring" fill="none">
      <circle cx="400" cy="400" r="101" stroke="#5363ee" stroke-width="2.5" stroke-dasharray="9 15" opacity=".72"/>
      <path d="M400 293V307M507 400H493M400 507V493M293 400H307" stroke="#5363ee" stroke-width="3" stroke-linecap="round"/>
      <circle cx="400" cy="299" r="4" fill="#c8ff5a" stroke="none" filter="url(#neon-glow)"/>
      <circle cx="501" cy="400" r="3.5" fill="#d86f4d" stroke="none" filter="url(#neon-glow)"/>
    </g>
    <g class="core-ring reverse" fill="none">
      <circle cx="400" cy="400" r="92" stroke="#c8ff5a" stroke-width="1.7" stroke-dasharray="2 17" opacity=".58"/>
      <path d="M336 336L346 346M464 336L454 346M464 464L454 454M336 464L346 454" stroke="#c8ff5a" stroke-width="2" stroke-linecap="round" opacity=".72"/>
    </g>
    <g filter="url(#neon-glow)">
      <circle r="3.7" fill="#5363ee" class="data-particle particle-fast p1"/>
      <circle r="2.8" fill="#c8ff5a" class="data-particle particle-fast p2"/>
      <circle r="2.4" fill="#5363ee" class="data-particle particle-fast p3"/>
      <circle r="3.1" fill="#d86f4d" class="data-particle particle-fast p4"/>
    </g>
    <g filter="url(#neon-glow)">
      <circle r="2" fill="#c8ff5a" class="data-particle particle-slow p1"/>
      <circle r="2.6" fill="#5363ee" class="data-particle particle-slow p2"/>
      <circle r="2.2" fill="#d86f4d" class="data-particle particle-slow p3"/>
      <circle r="1.9" fill="#5363ee" class="data-particle particle-slow p4"/>
    </g>
    <circle class="core-scanner" cx="400" cy="400" r="87" fill="none" stroke="#c8ff5a" stroke-width="4" stroke-linecap="round" stroke-dasharray="42 505" opacity=".8" filter="url(#neon-glow)"/>

    <g transform="translate(400 400)" filter="url(#core-shadow)">
      <circle r="106" fill="#5363ee" opacity=".09" class="pulse"/>
      <circle r="82" fill="url(#tan-core)"/>
      <circle r="82" fill="none" stroke="#5363ee" stroke-width="4"/>
      <path d="M0-69L60-35V35L0 69-60 35V-35Z" fill="none" stroke="#707cff" stroke-width="1.5" opacity=".25"/>
      <path d="M-72-10H-53L-43-20M72-10H53L43-20M-72 27H-55L-46 36M72 27H55L46 36" fill="none" stroke="#747fff" stroke-width="2" opacity=".45"/>
      <g fill="#c8ff5a" filter="url(#neon-glow)"><circle cx="-52" cy="-10" r="2.8"/><circle cx="52" cy="-10" r="2.8"/></g>
      <g fill="#5363ee"><circle cx="-54" cy="27" r="2.5"/><circle cx="54" cy="27" r="2.5"/></g>
      <path d="M-52-47A68 68 0 0 1 15-77" fill="none" stroke="#747fff" stroke-width="8" stroke-linecap="round" opacity=".52"/>
      <circle cx="-37" cy="-38" r="10" fill="#c8ff5a" opacity=".18"/>
      <text x="0" y="15" fill="#fdfdf9" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="720" letter-spacing="-3" text-anchor="middle" style="filter:drop-shadow(0 0 7px #5363ee)">Tan</text>
    </g>

    <rect x="1" y="1" width="798" height="798" rx="58" fill="none" stroke="#5363ee" stroke-opacity=".18" stroke-width="2"/>
  </g>
</svg>
